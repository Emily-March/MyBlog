name: Deploy to Tencent Cloud

on:
  # 腾讯云部署暂时改为手动触发。域名正式上线时再恢复 main 分支自动部署。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tencent-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SITE_URL: https://emilyfield.cn

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone application
        run: npm run build

      - name: Prepare release
        run: |
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public

      - name: Configure deployment key
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Prepare runtime environment
        env:
          RUNTIME_ENV: ${{ secrets.TENCENT_ENV_FILE }}
        run: |
          printf '%s\n' "$RUNTIME_ENV" > tencent.env
          chmod 600 tencent.env

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_PORT }}
          DEPLOY_USER: ${{ secrets.TENCENT_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '/opt/emilyfield-blog/releases/$GITHUB_SHA'"
          rsync -az --delete --partial --link-dest=/opt/emilyfield-blog/current/ -e "ssh -p $DEPLOY_PORT" release/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/emilyfield-blog/releases/$GITHUB_SHA/"
          scp -P "$DEPLOY_PORT" tencent.env "$DEPLOY_USER@$DEPLOY_HOST:/opt/emilyfield-blog/shared/.env.next"
          scp -P "$DEPLOY_PORT" deploy/deploy-release.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/emilyfield-blog/shared/deploy-release.sh"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.TENCENT_HOST }}
          DEPLOY_PORT: ${{ secrets.TENCENT_PORT }}
          DEPLOY_USER: ${{ secrets.TENCENT_USER }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 700 /opt/emilyfield-blog/shared/deploy-release.sh && /opt/emilyfield-blog/shared/deploy-release.sh '$GITHUB_SHA'"
